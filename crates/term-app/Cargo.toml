[package]
name = "term-app"
version = "0.0.1-beta4"
rust-version = "1.94"
edition = "2021"

# 无前端的应用层：动作、reducer、视图状态、菜单树、
# 能力面、选区与查找的**判定**都在这里，一行 UI 代码也没有。
#
# 依赖表就是 ADR-0016 的判据，而且**只有 term-core 一个**：
# - 没有 egui / eframe；
# - 没有 term-runtime——这一层**拿不到 PTY**，所以「界面层偷偷起进程」这种错误
#   在编译期就不成立；前台应用的其它消费者也因此可以直接复用它；
# - 也没有 term-import。2026-11-13 之前它是首次启动引导引进来的：
#   引导要把 `~/.ssh/config` 的文本变成「探测到的主机」。但 term-import 带
#   `std::fs` / `dirs` / `current_exe()`，一旦进来，「副作用只能以 `Effect`
#   返回」就从**编译器强制**降级成自律。现在解析适配（`ImportedSession` →
#   `DetectedHost`）留在投影层 `apps/desktop/src/ui/overlays/onboarding.rs`，
#   本层只保留 `OnboardingState` / `Step` / `DetectedHost` 这些纯状态类型。
#
# 该边界由 `scripts/verify.sh` 4d 的精确白名单守着（依赖表出现 term-core 以外的
# 任何 crate 即判红），不再是「靠 grep 关键字猜」。
[dependencies]
term-core = { path = "../term-core" }
# 字面查找在这里缓存编译结果（与 term-core 的 find_matches_regex_in 同一
# RegexBuilder 配置）。regex 是纯计算库：无 IO / 墙钟 / 线程，边界仍由
# verify.sh 4d 的「只许 term-core 一个内部 crate」守着。
regex = "1"

[features]
default = []
# 已实现、已测试，但**没有生产读者**的模块：现在只剩 `structure`。
#
# 2026-11-12 审查时这里还有别的候选模块，后来各有去处：触发器内核统一到
# `term-core::automation`（ADR-0030），其它有真读者的模块回到默认编译面——
# 与 `folds` / `tmux_layout` 同一规矩。`apps/desktop` 因此不再需要显式开本 feature。
#
# `structure` 的 `ScopeStack` / `StructureModel` 仍零读者，默认不编译不跑，
# `--features planned` 时回来。`verify.sh` 第 1 项会编一次防烂。
#
# 本 feature 与「已接线」无关：不能用它来决定某条命令是否可用，那由
# `capability` 台账判断。留在默认面的代码必须真的有读者，否则就删。
planned = []
