[workspace]
resolver = "2"
members = [
    "crates/term-core",
    "crates/term-io",
    "crates/term-import",
    "crates/term-paths",
    "crates/term-profile",
    "crates/term-runtime",
    "crates/term-session",
    "crates/term-script",
    "crates/term-bridge",
    "crates/term-app",
    "crates/term-vault",
    "crates/term-ssh",
    "crates/term-store",
    "crates/term-tunnel",
    "crates/term-sftp",
    "crates/term-xfer",
    "crates/term-zmodem",
    "apps/desktop",
]

# workspace 的 profile 必须写在根，写在 member 里会被 cargo 忽略。
#
# 2026-11-13：1.0 之前 release profile 只有 `opt-level = 2`，没有任何
# 产物定义。补上 lto / codegen-units / strip 三项，让「1.0 的二进制」有可复现的
# 构建方式。**`panic` 保持默认 `unwind`**：项目有 39 处生产路径 panic 的冻结基线
# 与 `catch_unwind` 用法，改 `abort` 会改变这些语义，且不是发布阻断项。
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
